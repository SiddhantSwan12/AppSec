name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Least privilege by default. Jobs that need more raise it themselves.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet_local_only
          POSTGRES_DB: securewallet
        # The published port matches .env.example, so CI and a local checkout
        # read the same configuration rather than drifting apart.
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U wallet -d securewallet"
          --health-interval 3s --health-timeout 3s --health-retries 20
      mail:
        image: axllent/mailpit:v1.29
        ports: ["1025:1025", "8025:8025"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # --ignore-scripts blocks install-time code execution from the
        # dependency tree. argon2 ships prebuilt binaries, so nothing here
        # needs a build step.
        run: npm ci --ignore-scripts

      - name: Create the test database
        run: |
          PGPASSWORD=wallet_local_only createdb -h 127.0.0.1 -p 54329 -U wallet securewallet_test

      - name: Configure environment
        run: cp .env.example .env

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - name: Validate the OpenAPI document
        run: npm run docs:check

      - name: Migrate and seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: API and integration tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Python runner unit tests
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes --no-deps -r security-runner/requirements.lock.txt || \
            .venv/bin/python -m pip install -r security-runner/requirements.lock.txt
          .venv/bin/python -m pytest security-runner -q

      - name: Configured authorization regression run
        # Exit 0 means every configured authorization rule held. Exit 1 is a
        # real authorization failure and must fail the build; exit 2 is a setup
        # problem and is equally not a pass.
        run: npm run security:run

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-evidence
          path: docs/evidence/
          retention-days: 14
